name: Snapshot Build

on:
  push:
    branches: [ main ]

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  deb:
    uses: ./.github/workflows/build-deb.yml

  apk:
    uses: ./.github/workflows/build-apk.yml
    secrets: inherit

  publish:
    needs: [ deb, apk ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish snapshot release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp $(find dist -name "*.deb") "clipbird-snapshot-linux-amd64.deb"
          cp $(find dist -name "*.apk") "clipbird-snapshot.apk"
          gh release delete snapshot --cleanup-tag --yes 2>/dev/null || true
          gh release create snapshot \
            "clipbird-snapshot-linux-amd64.deb" \
            "clipbird-snapshot.apk" \
            --title "snapshot" \
            --notes "Automated snapshot build from the latest commit on main. This is a rolling pre-release; assets are replaced with every push to main and may break at any time." \
            --prerelease
