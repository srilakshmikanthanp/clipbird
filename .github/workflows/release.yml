name: Release Build

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  deb:
    uses: ./.github/workflows/build-deb.yml

  apk:
    uses: ./.github/workflows/build-apk.yml
    secrets: inherit

  publish:
    needs: [ deb, apk ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cp $(find dist -name "*.deb") "clipbird-${TAG}-linux-amd64.deb"
          cp $(find dist -name "*.apk") "clipbird-${TAG}.apk"
          if [ "$(git cat-file -t "refs/tags/${TAG}")" = "tag" ]; then
            TAG_MESSAGE="$(git tag -l --format='%(contents)' "${TAG}")"
          else
            TAG_MESSAGE=""
          fi
          gh release create "${TAG}" \
            "clipbird-${TAG}-linux-amd64.deb" \
            "clipbird-${TAG}.apk" \
            --verify-tag \
            --title "${TAG}" \
            --notes "${TAG_MESSAGE}"
