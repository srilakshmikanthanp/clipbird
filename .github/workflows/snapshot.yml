name: Snapshot Build

on:
  push:
    branches: [ main ]

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  deb:
    uses: ./.github/workflows/snapshot-deb.yml

  apk:
    uses: ./.github/workflows/snapshot-apk.yml
    secrets: inherit

  publish:
    needs: [ deb, apk ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List artifacts
        run: find dist -type f

      - name: Publish snapshot release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete snapshot --cleanup-tag --yes 2>/dev/null || true
          gh release create snapshot dist/clipbird-deb/*.deb dist/clipbird-apk/*.apk \
            --title "Snapshot (latest main)" \
            --notes "Commit: ${{ github.sha }}" \
            --prerelease
