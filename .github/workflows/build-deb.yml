name: Snapshot - Linux (deb)

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config \
            libbluetooth-dev \
            libsystemd-dev

      - name: Set up JBR 25
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 25

      - name: Build .deb package
        run: ./gradlew :desktopApp:packageDeb --no-daemon -PnativeBuildType=Release

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipbird-deb
          path: desktopApp/build/**/*.deb
          retention-days: 1
